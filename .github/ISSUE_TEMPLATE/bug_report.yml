name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: aipass-proxy version
      placeholder: e.g. v0.1.2, or a commit SHA if built from source
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS / arch
      placeholder: e.g. linux-x64, darwin-arm64
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
